<div class="archive-rightpanel">
  <div class="archive-gadget">
    <div class="archive-gadget__title">System</div>

    <div class="archive-gadget__row">
      <span class="k">Archive:</span>
      <span class="v">Discord History</span>
    </div>

    <div class="archive-gadget__row">
      <span class="k">Status:</span>
      <span class="v"><span class="dot dot-green"></span> Stable</span>
    </div>

    <div class="archive-gadget__row">
      <span class="k">Sections:</span>
      <span class="v" id="archive-sections">—</span>
    </div>

    <div class="archive-gadget__row">
      <span class="k">Threads:</span>
      <span class="v" id="archive-threads">—</span>
    </div>

    <div class="archive-gadget__row">
      <span class="k">Theme:</span>
      <span class="v" id="archive-theme">—</span>
    </div>

    <div class="archive-gadget__actions">
      <button class="archive-btn" id="archive-random-btn" type="button">
        🎲 Random thread
      </button>
    </div>

    <div class="archive-gadget__hint">
      Tip: use Search to jump to a pairing.
    </div>
  </div>

  <div class="archive-tray" aria-label="System tray">
    <span class="tray-item" title="Network">🛜</span>
    <span class="tray-item" title="Sound">🔊</span>
    <span class="tray-item" title="Security">🛡️</span>
    <span class="tray-item" title="Archive locked">🔒</span>
    <span class="tray-clock" id="archive-clock">12:34</span>
  </div>
</div>
